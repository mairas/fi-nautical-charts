# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US

# Under 250 characters — the schema's limit.
tone_instructions: >-
  Name the trigger, the code path, and the user-visible consequence for every
  finding. If you cannot name one, do not raise it. No praise, no preamble, no
  restating the diff. Silence beats a nitpick.

reviews:
  profile: assertive
  poem: false
  in_progress_fortune: false

  auto_review:
    enabled: true
    drafts: false

  high_level_summary_instructions: |
    Write in present tense: "adds", not "added".
    Lead with what changes for someone building or serving charts, not with the
    file list. Do not restate the PR description back to the author.

  pre_merge_checks:
    title:
      mode: warning
      requirements: |
        A reader who sees only the title should understand what the PR does.
        Conventional-commit form: <type>(<scope>): <subject>, imperative mood.
    # Quoted: bare `off` is a YAML 1.1 boolean, and this field takes a string.
    description:
      mode: "off"

  tools:
    # There is no CI in this repo, so there are no checks to wait for. Leaving
    # the default 90s timeout in place is harmless; raising it would imply a
    # gate that does not exist.
    #
    # No linter is configured either, and none ever has been. Ruff's default
    # rules flag 47 findings on the current tree, almost all of them
    # conventions the project never adopted — shebangs without an exec bit on
    # files that are run via `uv run`, a deliberate `date.today()`, the two
    # blind `except Exception` handlers that let one layer fail without
    # stopping the run. That is a stream of noise against decisions already
    # made, so the reviewer should read the code rather than lint it.
    ruff:
      enabled: false
    # README and CLAUDE.md are deliberate prose with a deliberate voice.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

  path_filters:
    # Generated by `./run relock`; hundreds of resolved wheel URLs and hashes.
    - '!*.py.lock'

  path_instructions:
    - path: '**/*'
      instructions: |
        ## Evidence, not impressions
        Every finding states the trigger, the code path it runs through, and what
        the user sees. A finding you cannot express that way is not one. Say
        plainly when you are unsure rather than hedging an assertion.

        ## Comments
        Comments here are dense by deliberate choice and explain **why the code
        is the way it is** — usually which alternative was tried and what it
        cost. Do not ask for them to be trimmed for brevity. Do flag a comment
        that narrates a change ("fixes X", "we used to Y", "renamed from Z"):
        every comment must read correctly to someone who never saw the diff.

        ## Do not ask for these
        - **A `pyproject.toml`, a package, or a `src/` layout.** Every tool is a
          single file with PEP 723 inline metadata and a committed
          `<script>.py.lock`. Tools derive sibling paths from their own location
          and several import each other, so the flat co-located layout is load
          bearing. `./run relock` moves a dependency.
        - **A Makefile.** `./run` is the entry point. Each target is `function
          name {`, a `#@ Description` line, then a `#@ Category: X` line, in that
          order — the help text is generated by walking the file with awk.
        - **pip.** Everything runs through `uv`.
        - **A CHANGELOG.** There has never been one.
        - **Merging or flattening chart layers.** Each product is a separate
          MBTiles file, individually switchable in the chart software. Apparent
          duplication between layers is intentional and the user is emphatic
          about it.

        ## Scope
        One logical change per PR. Flag substantial unrelated work and suggest a
        separate PR; a called-out trivial fly-by fix is fine. Do not ask for
        refactoring of code the PR merely touches.

    - path: '{pipeline,traficom_dl,strip_nodata,downscale,publish,currency}.py'
      instructions: |
        These run unattended, monthly, for about ten hours, against a chart
        service that is someone else's. Judge changes by what a failure looks
        like to a person who is asleep.

        **Warning-and-continue is a silent success under a schedule.** A path
        that prints to stderr and carries on reports the same exit status as a
        clean run. Flag any new one, and say so when a change adds a way for the
        run to finish 0 having done nothing.

        **The destination must be left alone unless everything succeeded.**
        Publishing stages beside the target, verifies by reading back, and
        renames — it never transfers into the served directory, because an upload
        once truncated three of five files unnoticed. Flag anything that writes
        into the destination before the whole set is staged and verified.

        **Do not suggest inferring the downscale source zoom** from the deepest
        level present. It is per layer and explicit on purpose: a layer whose
        deepest level is itself an upscale would be rebuilt from that upscale,
        destroying detail several levels down.

        **Do not suggest re-deriving edition dates** from `Last-Modified` at any
        time other than the fetch that caused the tile. The server renders on
        demand and stamps what it just made, so a later sample reports the day we
        downloaded and is indistinguishable from a genuine new edition.

        **Do not suggest a full-grid sweep** to recover missing tiles, under any
        name. Completeness fixes must be pruned methods that are provably
        gap-free.

        This code targets small shared hardware and runs as a low-priority guest.
        Bounded worker counts, `nice` and `ionice` are deliberate, not
        conservatism to optimise away.

    - path: 'test_*.py'
      instructions: |
        **Judge whether a test can fail.** Value tests that fail when the
        production change is reverted. Flag assertions on source text, on a
        stub's recorded intent rather than on observable state, and on internals
        an equivalent implementation would change.

        Three verification anti-patterns have each produced a confident green
        result in this repo, and are worth watching for: fixtures that sit wholly
        inside the thing under test, so the comparison runs the same code twice;
        a test that reimplements the logic it checks and compares it against
        itself; and a comparison that passes when both sides find nothing.

        The pipeline's orchestration is deliberately tested through a stubbed
        step runner — the steps are subprocesses and stay that way, and they have
        their own tests. Do not suggest running them for real here.

        `./run test` names its five test files explicitly, because a bare
        `pytest` collects scratch files too. A new test file must be added to
        that list.

    - path: 'systemd/*'
      instructions: |
        A systemd **user** timer, because the tooling installs user-scoped and
        nothing here needs root.

        `$VAR` rather than `${VAR}` in `ExecStart` is deliberate: systemd
        substitutes `${VAR}` inside a word and leaves a bare `$VAR` that is not a
        word of its own, which is what hands expansion to the shell and keeps a
        path containing a space one argument. Do not suggest "fixing" the braces.

        `TimeoutStartSec` is finite on purpose. `Type=oneshot` disables the start
        timeout by default, so the value replaces no timeout at all, and it
        bounds a wedged ten-hour run before the next month's would start.

    - path: '**/*.md'
      instructions: |
        Documentation describes the current state. Flag implementation-status
        language ("Step 3", "TODO", "currently implemented as"), build
        narratives, and unchecked checklist items.

        **A rule's justification is not development history.** "Publish by
        rename, never by transfer — an upload once truncated three of five files
        and nobody noticed for six days" is one sentence of rule and one of
        evidence, and the evidence is what stops the rule being optimised away by
        someone who thinks it is fussiness. Keep those. Flag narrative that no
        rule depends on: what was tried in which order, what a previous pass
        cleaned up, how the current state came about.

        This repository is **public**, so flag detail that identifies *our own
        infrastructure*: host names, addresses, filesystem paths, usernames,
        hardware models, or a list of what runs on our machines. Those belong in
        the gitignored `CLAUDE.local.md`. Such detail leaks through reasoning
        rather than through carelessness with secrets — it gets written down
        because it is the honest justification for a design decision — and the
        constraint can almost always be stated as a property of the work instead.

        **This does not include third-party software the project targets or
        depends on.** Signal K, Freeboard-SK, Traficom, uv, systemd and SQLite
        are public projects and services, and naming them is the point of the
        document. Do not ask for them to be genericised.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - CLAUDE.md
